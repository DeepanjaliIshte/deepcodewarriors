version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: deep-code-warriors-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deep_code_warriors
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      
  pgadmin:
    image: dpage/pgadmin4
    container_name: deep-code-warriors-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@deepcodewarriors.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
